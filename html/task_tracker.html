<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>task-tracker :: cli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117;
    --surface:#141A21;
    --surface-raised:#1B222B;
    --border:#232B36;
    --text:#E6EDF3;
    --text-dim:#7D8A99;
    --text-faint:#4B5563;
    --accent:#5EEAD4;
    --accent-dim:#2D5F58;
    --warn:#F0B429;
    --danger:#F87171;
    --success:#34D399;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim);color:var(--accent);}

  /* ---- top bar ---- */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#141A21,#0F151B);
  }
  .cursor{
    width:9px;height:16px;background:var(--accent);
    animation:blink 1.1s steps(1) infinite;
    box-shadow:0 0 8px var(--accent);
  }
  @keyframes blink{50%{opacity:0;}}
  .prompt{font-weight:700;font-size:15px;letter-spacing:.2px;}
  .prompt span{color:var(--accent);}
  .led-row{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);}
  .led{width:8px;height:8px;border-radius:50%;background:var(--text-faint);transition:.2s;}
  .led.up{background:var(--success);box-shadow:0 0 6px var(--success);}
  .led.down{background:var(--danger);box-shadow:0 0 6px var(--danger);}
  .base-url{
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    padding:4px 8px;
    border-radius:4px;
    width:200px;
  }
  .base-url:focus{outline:none;border-color:var(--accent-dim);color:var(--text);}

  /* ---- layout ---- */
  .shell{display:flex;min-height:calc(100vh - 53px);}
  nav.menu{
    width:220px;
    border-right:1px solid var(--border);
    padding:18px 0;
    flex-shrink:0;
  }
  .menu-label{
    font-size:10px;letter-spacing:1.5px;color:var(--text-faint);
    padding:0 18px 10px;text-transform:uppercase;
  }
  .menu-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 18px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:13px;
    border-left:2px solid transparent;
    transition:.12s;
  }
  .menu-item:hover{color:var(--text);background:var(--surface);}
  .menu-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--surface);}
  .menu-item .num{
    color:var(--text-faint);font-weight:700;font-size:11px;
    width:16px;text-align:right;
  }
  .menu-item.active .num{color:var(--accent);}

  main{flex:1;padding:24px 28px;min-width:0;}
  .panel-title{font-size:16px;font-weight:700;margin:0 0 4px;}
  .panel-sub{font-family:var(--sans);color:var(--text-dim);font-size:12.5px;margin:0 0 20px;}

  /* ---- table ---- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;
    color:var(--text-faint);border-bottom:1px solid var(--border);
    padding:8px 10px;font-weight:600;
  }
  tbody td{
    padding:10px;border-bottom:1px solid var(--border);
    color:var(--text);vertical-align:top;
  }
  tbody tr:hover{background:var(--surface);}
  .id-cell{color:var(--text-faint);font-size:11.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .desc-cell{color:var(--text-dim);max-width:280px;}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;
  }
  .badge.done{background:rgba(52,211,153,.12);color:var(--success);}
  .badge.pending{background:rgba(240,180,41,.12);color:var(--warn);}
  input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}

  /* ---- forms / controls ---- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;letter-spacing:.3px;}
  .field input[type=text], .field textarea{
    width:100%;background:var(--surface-raised);border:1px solid var(--border);
    color:var(--text);padding:9px 10px;border-radius:5px;font-family:var(--mono);font-size:13px;
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--accent-dim);}
  .field textarea{resize:vertical;min-height:70px;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  .btn{
    font-family:var(--mono);font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:5px;border:1px solid var(--border);
    background:var(--surface-raised);color:var(--text);cursor:pointer;transition:.12s;
  }
  .btn:hover{border-color:var(--accent-dim);color:var(--accent);}
  .btn.primary{background:var(--accent);color:#0B1512;border-color:var(--accent);}
  .btn.primary:hover{filter:brightness(1.08);color:#0B1512;}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:20px;max-width:420px;
  }

  /* ---- status line / log ---- */
  .statusline{
    margin-top:18px;padding:10px 12px;border-radius:6px;
    background:var(--surface);border:1px solid var(--border);
    font-size:12px;color:var(--text-dim);
    display:flex;align-items:center;gap:8px;
  }
  .statusline.ok{border-color:rgba(52,211,153,.3);color:var(--success);}
  .statusline.err{border-color:rgba(248,113,113,.3);color:var(--danger);}
  .statusline .tag{color:var(--text-faint);}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar .btn{padding:7px 12px;font-size:12px;}
  .empty{color:var(--text-faint);font-size:13px;padding:30px 0;text-align:center;font-family:var(--sans);}
  .count-pill{
    font-size:11px;color:var(--text-dim);background:var(--surface-raised);
    border:1px solid var(--border);padding:3px 9px;border-radius:20px;margin-left:auto;
  }
  .search-input{
    background:var(--surface-raised);border:1px solid var(--border);color:var(--text);
    padding:7px 10px;border-radius:5px;font-family:var(--mono);font-size:12.5px;width:200px;
  }
  .search-input:focus{outline:none;border-color:var(--accent-dim);}
</style>
</head>
<body>

<div class="topbar">
  <div class="cursor"></div>
  <div class="prompt">task-tracker <span>// web</span></div>
  <div class="led-row">
    <span id="pingLabel">checking…</span>
    <span class="led" id="led"></span>
    <input class="base-url" id="baseUrl" value="https://lcx7z06p-5000.inc1.devtunnels.ms" spellcheck="false">
  </div>
</div>

<div class="shell">
  <nav class="menu">
    <div class="menu-label">Commands</div>
    <div class="menu-item active" data-view="list"><span class="num">1</span>List tasks</div>
    <div class="menu-item" data-view="add"><span class="num">2</span>Add task</div>
    <div class="menu-item" data-view="deleteId"><span class="num">3</span>Delete by ID</div>
    <div class="menu-item" data-view="deleteTitle"><span class="num">4</span>Delete by title</div>
    <div class="menu-item" data-view="count"><span class="num">5</span>Count tasks</div>
    <div class="menu-item" data-view="find"><span class="num">6</span>Find by title</div>
    <div class="menu-item" data-view="updateMany"><span class="num">7</span>Update many</div>
  </nav>

  <main id="main"></main>
</div>

<script>
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const main = $('#main');
const baseUrlInput = $('#baseUrl');
let selectedIds = new Set();

function baseUrl(){ return baseUrlInput.value.replace(/\/$/, ''); }

async function api(path, opts={}) {
  const res = await fetch(baseUrl() + path, {
    headers: {'Content-Type':'application/json'},
    ...opts
  });
  let body = null;
  try { body = await res.json(); } catch(e) { body = await res.text().catch(()=>null); }
  if (!res.ok) throw { status: res.status, body };
  return body;
}

function statusLine(container, ok, msg) {
  const el = document.createElement('div');
  el.className = 'statusline ' + (ok ? 'ok' : 'err');
  el.innerHTML = `<span class="tag">${ok ? '$ ok' : '$ error'}</span> ${msg}`;
  container.appendChild(el);
}

async function pingServer() {
  const led = $('#led'), label = $('#pingLabel');
  try {
    await api('/tasks');
    led.className = 'led up'; label.textContent = 'connected';
  } catch(e) {
    led.className = 'led down'; label.textContent = 'unreachable';
  }
}
baseUrlInput.addEventListener('change', pingServer);

function setActive(view) {
  $$('.menu-item').forEach(m => m.classList.toggle('active', m.dataset.view === view));
}

function taskTable(tasks, {selectable=false} = {}) {
  if (!tasks || tasks.length === 0) return `<div class="empty">No tasks found.</div>`;
  const rows = tasks.map(t => `
    <tr data-id="${t.id ?? ''}">
      ${selectable ? `<td><input type="checkbox" class="row-check" ${selectedIds.has(t.id) ? 'checked' : ''}></td>` : ''}
      <td class="id-cell">${t.id ?? ''}</td>
      <td>${escapeHtml(t.title ?? '')}</td>
      <td class="desc-cell">${escapeHtml(t.description ?? '')}</td>
      <td>${t.completed ? '<span class="badge done">done</span>' : '<span class="badge pending">pending</span>'}</td>
    </tr>`).join('');
  return `
    <table>
      <thead><tr>
        ${selectable ? '<th></th>' : ''}
        <th>ID</th><th>Title</th><th>Description</th><th>Status</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- views ---------- */

async function viewList() {
  setActive('list');
  main.innerHTML = `
    <div class="panel-title">List tasks</div>
    <p class="panel-sub">GET /tasks — everything currently tracked.</p>
    <div class="toolbar">
      <button class="btn" id="refreshBtn">↻ refresh</button>
      <input class="search-input" id="filterInput" placeholder="filter by title...">
      <span class="count-pill" id="countPill">–</span>
    </div>
    <div id="tableWrap"><div class="empty">Loading…</div></div>
    <div id="statusWrap"></div>
  `;
  let allTasks = [];
  async function load() {
    try {
      allTasks = await api('/tasks');
      render(allTasks);
    } catch(e) {
      $('#tableWrap').innerHTML = '';
      statusLine($('#statusWrap'), false, `couldn't reach /tasks — ${describeErr(e)}`);
    }
  }
  function render(tasks) {
    $('#tableWrap').innerHTML = taskTable(tasks);
    $('#countPill').textContent = `${tasks.length} task${tasks.length===1?'':'s'}`;
  }
  $('#refreshBtn').onclick = load;
  $('#filterInput').oninput = (e) => {
    const q = e.target.value.toLowerCase();
    render(allTasks.filter(t => (t.title||'').toLowerCase().includes(q)));
  };
  load();
}

async function viewAdd() {
  setActive('add');
  main.innerHTML = `
    <div class="panel-title">Add task</div>
    <p class="panel-sub">POST /task</p>
    <div class="card">
      <div class="field"><label>Title</label><input type="text" id="fTitle"></div>
      <div class="field"><label>Description</label><textarea id="fDesc"></textarea></div>
      <div class="field check-row"><input type="checkbox" id="fCompleted"><label for="fCompleted" style="margin:0;">Completed</label></div>
      <div class="btn-row"><button class="btn primary" id="submitBtn">Create task</button></div>
    </div>
    <div id="statusWrap"></div>
  `;
  $('#submitBtn').onclick = async () => {
    const title = $('#fTitle').value.trim();
    if (!title) { statusLine($('#statusWrap'), false, 'title is required.'); return; }
    const payload = { title, description: $('#fDesc').value, completed: $('#fCompleted').checked };
    try {
      const created = await api('/task', { method:'POST', body: JSON.stringify(payload) });
      statusLine($('#statusWrap'), true, `created "${escapeHtml(title)}" — ${escapeHtml(JSON.stringify(created))}`);
      $('#fTitle').value=''; $('#fDesc').value=''; $('#fCompleted').checked=false;
    } catch(e) {
      statusLine($('#statusWrap'), false, describeErr(e));
    }
  };
}

async function viewDeleteId() {
  setActive('deleteId');
  main.innerHTML = `
    <div class="panel-title">Delete by ID</div>
    <p class="panel-sub">DELETE /task/&lt;id&gt;</p>
    <div class="card">
      <div class="field"><label>Task ID</label><input type="text" id="fId"></div>
      <div class="btn-row"><button class="btn danger" id="delBtn">Delete task</button></div>
    </div>
    <div id="statusWrap"></div>
  `;
  $('#delBtn').onclick = async () => {
    const id = $('#fId').value.trim();
    if (!id) return;
    try {
      const res = await api(`/task/${encodeURIComponent(id)}`, { method:'DELETE' });
      statusLine($('#statusWrap'), true, `deleted — ${escapeHtml(JSON.stringify(res))}`);
    } catch(e) {
      statusLine($('#statusWrap'), false, describeErr(e));
    }
  };
}

async function viewDeleteTitle() {
  setActive('deleteTitle');
  main.innerHTML = `
    <div class="panel-title">Delete by title</div>
    <p class="panel-sub">DELETE /task1/&lt;title&gt;</p>
    <div class="card">
      <div class="field"><label>Title</label><input type="text" id="fTitle"></div>
      <div class="btn-row"><button class="btn danger" id="delBtn">Delete task</button></div>
    </div>
    <div id="statusWrap"></div>
  `;
  $('#delBtn').onclick = async () => {
    const title = $('#fTitle').value.trim();
    if (!title) return;
    try {
      const res = await api(`/task1/${encodeURIComponent(title)}`, { method:'DELETE' });
      statusLine($('#statusWrap'), true, `deleted — ${escapeHtml(JSON.stringify(res))}`);
    } catch(e) {
      statusLine($('#statusWrap'), false, describeErr(e));
    }
  };
}

async function viewCount() {
  setActive('count');
  main.innerHTML = `
    <div class="panel-title">Count tasks</div>
    <p class="panel-sub">GET /taskscount/</p>
    <div class="card"><div id="countVal" style="font-size:32px;font-weight:800;color:var(--accent);">–</div></div>
    <div id="statusWrap"></div>
  `;
  try {
    const res = await api('/taskscount');
    $('#countVal').textContent = typeof res === 'object' ? JSON.stringify(res) : res;
  } catch(e) {
    statusLine($('#statusWrap'), false, describeErr(e));
  }
}

async function viewFind() {
  setActive('find');
  main.innerHTML = `
    <div class="panel-title">Find by title</div>
    <p class="panel-sub">GET /task/&lt;title&gt;</p>
    <div class="toolbar">
      <input class="search-input" id="fTitle" placeholder="title to search" style="width:260px;">
      <button class="btn primary" id="searchBtn">Search</button>
    </div>
    <div id="tableWrap"></div>
    <div id="statusWrap"></div>
  `;
  $('#searchBtn').onclick = async () => {
    const title = $('#fTitle').value.trim();
    if (!title) return;
    try {
      const res = await api(`/task/${encodeURIComponent(title)}`);
      $('#tableWrap').innerHTML = taskTable(Array.isArray(res) ? res : [res]);
    } catch(e) {
      $('#tableWrap').innerHTML = '';
      statusLine($('#statusWrap'), false, describeErr(e));
    }
  };
}

/* ---- new: bulk update-many ---- */
async function viewUpdateMany() {
  setActive('updateMany');
  main.innerHTML = `
    <div class="panel-title">Update many</div>
    <p class="panel-sub">Select tasks below, then apply a change to all of them at once — sends PUT /tasks/update_many.</p>
    <div class="toolbar">
      <button class="btn" id="refreshBtn">↻ refresh</button>
      <span class="count-pill" id="countPill">–</span>
    </div>
    <div id="tableWrap"><div class="empty">Loading…</div></div>

    <div class="card" style="margin-top:18px;max-width:520px;">
      <div class="field">
        <label>Selected</label>
        <div style="font-size:13px;color:var(--text-dim);" id="selCount">0 tasks selected</div>
      </div>
      <div class="field">
        <label>Set "completed" to</label>
        <select id="fBulkCompleted" style="width:100%;background:var(--surface-raised);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:5px;font-family:var(--mono);font-size:13px;">
          <option value="true">true</option>
          <option value="false">false</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="applyBtn" disabled>Apply to selected</button>
        <button class="btn" id="clearBtn">Clear selection</button>
      </div>
    </div>
    <div id="statusWrap"></div>
  `;

  let allTasks = [];
  async function load() {
    try {
      allTasks = await api('/tasks');
      render();
    } catch(e) {
      $('#tableWrap').innerHTML = '';
      statusLine($('#statusWrap'), false, `couldn't reach /tasks — ${describeErr(e)}`);
    }
  }
  function render() {
    $('#tableWrap').innerHTML = taskTable(allTasks, {selectable:true});
    $('#countPill').textContent = `${allTasks.length} task${allTasks.length===1?'':'s'}`;
    $$('.row-check').forEach(cb => {
      cb.onchange = (e) => {
        const id = e.target.closest('tr').dataset.id;
        if (e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
        updateSelCount();
      };
    });
    updateSelCount();
  }
  function updateSelCount() {
    $('#selCount').textContent = `${selectedIds.size} task${selectedIds.size===1?'':'s'} selected`;
    $('#applyBtn').disabled = selectedIds.size === 0;
  }
  $('#refreshBtn').onclick = load;
  $('#clearBtn').onclick = () => { selectedIds.clear(); render(); };
  $('#applyBtn').onclick = async () => {
    const ids = Array.from(selectedIds);
    const completed = $('#fBulkCompleted').value === 'true';
    try {
      const res = await api('/tasks/update_many', {
        method: 'PUT',
        body: JSON.stringify({ ids, fields: { completed } })
      });
      statusLine($('#statusWrap'), true, `updated ${ids.length} task(s) — ${escapeHtml(JSON.stringify(res))}`);
      selectedIds.clear();
      load();
    } catch(e) {
      statusLine($('#statusWrap'), false, `${describeErr(e)} — this endpoint isn't in your Flask app yet, see note below.`);
    }
  };

  load();
}

function describeErr(e) {
  if (e && e.status) return `HTTP ${e.status}: ${typeof e.body === 'object' ? JSON.stringify(e.body) : e.body}`;
  return e && e.message ? e.message : String(e);
}

/* ---------- routing ---------- */
const views = {
  list: viewList, add: viewAdd, deleteId: viewDeleteId,
  deleteTitle: viewDeleteTitle, count: viewCount, find: viewFind,
  updateMany: viewUpdateMany
};
$$('.menu-item').forEach(item => {
  item.onclick = () => { selectedIds.clear(); views[item.dataset.view](); };
});

pingServer();
viewList();
</script>
</body>
</html>
